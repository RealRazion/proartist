<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="slv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#64748b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="slv-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="slv-rim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="slv-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="slv-plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="slv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="120" cy="120" r="105" fill="url(#slv-glow)" />

  <g filter="url(#slv-shadow)">
    <!-- Cyber Wing Blades Left -->
    <path d="M 38 65 L 68 58 L 78 92 L 48 118 L 30 88 Z" fill="url(#slv-metal)" stroke="url(#slv-rim)" stroke-width="2" />
    <path d="M 26 90 L 52 118 L 42 144 L 20 110 Z" fill="url(#slv-metal)" opacity="0.85" />
    <path d="M 16 112 L 38 142 L 30 162 L 12 128 Z" fill="url(#slv-metal)" opacity="0.6" />

    <!-- Cyber Wing Blades Right -->
    <path d="M 202 65 L 172 58 L 162 92 L 192 118 L 210 88 Z" fill="url(#slv-metal)" stroke="url(#slv-rim)" stroke-width="2" />
    <path d="M 214 90 L 188 118 L 198 144 L 220 110 Z" fill="url(#slv-metal)" opacity="0.85" />
    <path d="M 224 112 L 202 142 L 210 162 L 228 128 Z" fill="url(#slv-metal)" opacity="0.6" />

    <!-- Main Shield Outer -->
    <path d="M 120 18 L 186 52 L 174 148 L 120 212 L 66 148 L 54 52 Z" 
          fill="url(#slv-metal)" stroke="url(#slv-rim)" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Dark Chrome Plate -->
    <path d="M 120 32 L 172 62 L 162 140 L 120 194 L 78 140 L 68 62 Z" 
          fill="url(#slv-plate)" stroke="#475569" stroke-width="2" />

    <!-- Frost Diamond Crystal Inlay -->
    <polygon points="120,54 156,86 120,165 84,86" fill="url(#slv-plate)" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="120,54 120,165 84,86" fill="#082f49" opacity="0.6" />
    
    <!-- Radiant Cyan Core Gem -->
    <polygon points="120,72 145,95 120,140 95,95" fill="url(#slv-core)" stroke="#bae6fd" stroke-width="2" />
    <polygon points="120,72 120,140 95,95" fill="#0369a1" />

    <!-- Specular Highlight Glint -->
    <circle cx="112" cy="88" r="4" fill="#ffffff" filter="blur(1px)" />

    <!-- Roman Numeral II -->
    <text x="120" y="118" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="900" 
          text-anchor="middle" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">II</text>

    <!-- Bottom Ribbon Banner -->
    <path d="M 64 186 L 120 180 L 176 186 L 185 208 L 120 218 L 55 208 Z" 
          fill="url(#slv-metal)" stroke="url(#slv-rim)" stroke-width="2" />
    <text x="120" y="204" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="900" 
          letter-spacing="3" text-anchor="middle" fill="#ffffff" filter="drop-shadow(0 2px 4px #000)">SILBER</text>
  </g>
</svg>