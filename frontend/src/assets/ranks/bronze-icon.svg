<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="brz-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brz-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="brz-rim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="brz-plate" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a1608" />
      <stop offset="100%" stop-color="#140a04" />
    </linearGradient>
    <filter id="brz-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b45309" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="105" fill="url(#brz-glow)" />

  <!-- Outer Winged Crest Shapes -->
  <g filter="url(#brz-shadow)">
    <!-- Left Wing -->
    <path d="M 40 70 L 65 62 L 75 95 L 50 115 L 35 90 Z" fill="url(#brz-metal)" stroke="url(#brz-rim)" stroke-width="2" />
    <path d="M 30 92 L 52 118 L 45 140 L 25 110 Z" fill="url(#brz-metal)" opacity="0.8" />
    <path d="M 22 112 L 42 142 L 35 160 L 18 128 Z" fill="url(#brz-metal)" opacity="0.6" />

    <!-- Right Wing -->
    <path d="M 200 70 L 175 62 L 165 95 L 190 115 L 205 90 Z" fill="url(#brz-metal)" stroke="url(#brz-rim)" stroke-width="2" />
    <path d="M 210 92 L 188 118 L 195 140 L 215 110 Z" fill="url(#brz-metal)" opacity="0.8" />
    <path d="M 218 112 L 198 142 L 205 160 L 222 128 Z" fill="url(#brz-metal)" opacity="0.6" />

    <!-- Main Outer Shield -->
    <path d="M 120 22 L 182 55 L 170 145 L 120 208 L 70 145 L 58 55 Z" 
          fill="url(#brz-metal)" stroke="url(#brz-rim)" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Dark Plate -->
    <path d="M 120 36 L 168 64 L 158 138 L 120 190 L 82 138 L 72 64 Z" 
          fill="url(#brz-plate)" stroke="#92400e" stroke-width="2" />

    <!-- Faceted Chiseled Core Pattern -->
    <path d="M 120 52 L 152 75 L 120 168 L 88 75 Z" fill="#451a03" stroke="#b45309" stroke-width="1.5" />
    <path d="M 120 52 L 120 168 L 88 75 Z" fill="#2e1102" />

    <!-- Central Bronze Ingot & Star -->
    <polygon points="120,70 133,98 163,101 140,121 147,150 120,135 93,150 100,121 77,101 107,98" 
             fill="url(#brz-rim)" stroke="#fff" stroke-width="0.8" />

    <!-- Engraved Roman Numeral I -->
    <text x="120" y="128" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="900" 
          text-anchor="middle" fill="#451a03">I</text>

    <!-- Bottom Ribbon Banner -->
    <path d="M 68 185 L 120 178 L 172 185 L 180 205 L 120 216 L 60 205 Z" 
          fill="url(#brz-metal)" stroke="url(#brz-rim)" stroke-width="2" />
    <text x="120" y="202" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="900" 
          letter-spacing="3" text-anchor="middle" fill="#fff" filter="drop-shadow(0 2px 4px #000)">BRONZE</text>
  </g>
</svg>