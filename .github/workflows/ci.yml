name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run build
        working-directory: frontend
        run: |
          npm run build 2>&1 | tee ../build.log
      - name: Post error comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="BUILD LOG:
          \`\`\`
          $(tail -n 80 ../build.log)
          \`\`\`" || true

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
        run: |
          python manage.py migrate --noinput
          python manage.py test

  android-apk:
    name: Build UNYQ Finance Android APK
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build Web Bundle & Sync Capacitor Android
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://proartist.onrender.com
          VITE_API_BASE_URL_MOBILE: https://proartist.onrender.com
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Assemble Android APK
        working-directory: frontend/android
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../UNYQ-Finance.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNYQ-Finance-APK
          path: UNYQ-Finance.apk
      - name: Publish Latest APK Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-apk >/dev/null 2>&1 || gh release create latest-apk --title "UNYQ Finance Android APK" --notes "Automatisch gebauter aktueller Android-Build von UNYQ Finance."
          gh release upload latest-apk UNYQ-Finance.apk --clobber
